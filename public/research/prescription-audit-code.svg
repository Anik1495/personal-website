<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
<rect width="1280" height="700" rx="24" fill="#0f172a"/>
<rect x="0" y="0" width="1280" height="70" rx="24" fill="#1e293b"/>
<text x="42" y="46" fill="#e2e8f0" font-family="Menlo,Consolas,monospace" font-size="25">audit_writer.py</text>
<text x="1000" y="45" fill="#94a3b8" font-family="Menlo,Consolas,monospace" font-size="17">source excerpt</text>
<text x="38" y="110" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">110</text>
<text x="92" y="110" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;This is a prescription audit system.&quot;,</text>
<text x="38" y="141" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">111</text>
<text x="92" y="141" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        f&quot;Review only the provided candidates for section {section}.&quot;,</text>
<text x="38" y="172" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">112</text>
<text x="92" y="172" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;Do not invent new errors.&quot;,</text>
<text x="38" y="203" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">113</text>
<text x="92" y="203" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;Confirm, reject, or refine candidates using the provided evidence.&quot;,</text>
<text x="38" y="234" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">114</text>
<text x="92" y="234" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;Omit every candidate that is not supported.&quot;,</text>
<text x="38" y="265" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">115</text>
<text x="92" y="265" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;Be concise: why &lt;= 25 words, correction &lt;= 25 words.&quot;,</text>
<text x="38" y="296" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">116</text>
<text x="92" y="296" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;Do not debate inside JSON fields. Do not write phrases like &#x27;wait&#x27;, &quot;</text>
<text x="38" y="327" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">117</text>
<text x="92" y="327" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;&#x27;let us re-evaluate&#x27;, &#x27;strictly speaking&#x27;, or internal calculations. &quot;</text>
<text x="38" y="358" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">118</text>
<text x="92" y="358" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        &quot;Use only the final conclusion.&quot;,</text>
<text x="38" y="389" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">119</text>
<text x="92" y="389" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">    ]</text>
<text x="38" y="420" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">120</text>
<text x="92" y="420" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">    if repair_instruction:</text>
<text x="38" y="451" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">121</text>
<text x="92" y="451" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        lines.append(repair_instruction)</text>
<text x="38" y="482" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">122</text>
<text x="92" y="482" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">    lines.extend(</text>
<text x="38" y="513" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">123</text>
<text x="92" y="513" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">        [</text>
<text x="38" y="544" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">124</text>
<text x="92" y="544" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">            &quot;Every finding must come from exactly one provided candidate only.&quot;,</text>
<text x="38" y="575" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">125</text>
<text x="92" y="575" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">            &quot;For each finding include concern_level. Use critical for immediate &quot;</text>
<text x="38" y="606" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">126</text>
<text x="92" y="606" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">            &quot;or high-risk safety issues; major for important clinician/&quot;</text>
<text x="38" y="637" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="18">127</text>
<text x="92" y="637" fill="#cbd5e1" font-family="Menlo,Consolas,monospace" font-size="18" xml:space="preserve">            &quot;pharmacist review; moderate for relevant non-urgent review; minor &quot;</text>
</svg>